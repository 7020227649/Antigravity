name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and metadata smoke tests
        run: |
          bash -n install.sh launch-gui.sh stop-gui.sh lib/app-metadata.sh tests/smoke.sh
          python3 -m py_compile lib/resolve-download.py
          bash tests/smoke.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck install.sh launch-gui.sh stop-gui.sh lib/app-metadata.sh tests/smoke.sh
